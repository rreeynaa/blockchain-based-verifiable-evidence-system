[project]
name = "bves"
version = "0.1.0"
description = "Blockchain-Based Verifiable Evidence System for Cloud Intrusions"
requires-python = ">=3.11"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]  # FastAPI Depends() in defaults is idiomatic

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
